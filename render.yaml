# Render 部署設定
# - Web Service：購物網站
# - Cron Job：每日 08:00 (Asia/Taipei) 執行搜尋、08:30 執行商品智慧管線
# 資料層為 Supabase PostgreSQL（Render 免費層檔案系統為暫存，不可放任何資料庫檔案）。

services:
  - type: web
    name: jp-costco-shop
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SITE_URL
        value: https://jp-costco-shop.onrender.com
      - key: SUPABASE_URL
        value: https://ktqupvrefxejjjsacbqd.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
      - key: COSTCO_DRIVE_FOLDER_ID
        value: 1_Ryc7z4Et-M5lRA0q96gIUfYPDX8TelB
      - key: LIVE_STREAM_URL
        sync: false
      - key: LINE_PHASE
        value: "1"
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: cron
    name: jp-costco-daily-search
    runtime: node
    plan: free
    schedule: "0 8 * * *"
    envVars:
      - key: SITE_URL
        value: https://jp-costco-shop.onrender.com
      - key: CRON_SECRET
        sync: false
    buildCommand: npm install
    startCommand: curl -fsS -H "x-cron-secret: $CRON_SECRET" "$SITE_URL/api/cron/run-search"

  # 3.0：每日商品智慧管線（雷達 → 評分 → AI 採購決策）
  - type: cron
    name: jp-costco-daily-agents
    runtime: node
    plan: free
    schedule: "30 8 * * *"
    envVars:
      - key: SITE_URL
        value: https://jp-costco-shop.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://ktqupvrefxejjjsacbqd.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ASTRA_ENDPOINT
        sync: false
      - key: ASTRA_API_KEY
        sync: false
    buildCommand: npm install
    startCommand: curl -fsS -H "x-cron-secret: $CRON_SECRET" "$SITE_URL/api/cron/run-agents"
